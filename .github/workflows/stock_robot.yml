name: Daily Stock Screener

on:
  schedule:
    # 매일 월요일~금요일 한국 시간 오후 4시 00분(UTC 오전 7시)에 자동 실행
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 💡 [치트키] 깃허브 검색창을 거치지 않고 오피셜 압축 파일을 다이렉트로 다운받아 강제 설치합니다.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy
        pip install finance-datareader
        pip install requests
        pip install https://github.com/twopirllc/pandas-ta/archive/refs/heads/main.zip

    - name: Run script
      env:
        # 🔒 보안 비밀 금고 연동 (해킹 완벽 방어)
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # 회원님의 실제 파이썬 파일 이름인 RCI_BOTTOM.py를 정확하게 가동합니다.
      run: python RCI_BOTTOM.py
