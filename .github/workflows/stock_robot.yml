name: Daily Stock Screener

on:
  schedule:
    # 매일 월요일~금요일 한국 시간 오후 4시 00분(UTC 오전 7시)에 자동 실행
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 설치 버전을 유연하게 풀어서 에러를 완벽히 우회한 빌드 구역입니다.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas==2.1.4 numpy==1.26.4
        pip install finance-datareader
        pip install pandas-ta
        pip install requests

    - name: Run script
      env:
        # 🔒 보안 철저 유지 (Secrets 금고 연동)
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # 회원님의 실제 파이썬 파일 이름인 RCI_BOTTOM.py를 실행합니다.
      run: python RCI_BOTTOM.py
