name: Daily Stock Screener

on:
  schedule:
    # 매일 월요일~금요일 한국 시간 오후 4시 00분(UTC 오전 7시)에 자동 실행
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 💡 404 에러를 유발하던 주소를 올바른 'master.zip'으로 수정하고 완전히 고정했습니다.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy
        pip install finance-datareader
        pip install requests
        pip install https://github.com/twopirllc/pandas-ta/archive/refs/heads/master.zip

    - name: Run script
      env:
        # 🔒 보안 비밀 금고 연동 (해킹 철저 방어)
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # 회원님의 실제 파이썬 파일인 RCI_BOTTOM.py를 가동합니다.
      run: python RCI_BOTTOM.py
